<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITULO}}</title>
<style>
/*{{ESTILOS}}*/
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ico-red" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/><circle cx="4" cy="5" r="2"/><circle cx="20" cy="5" r="2"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="19" r="2"/>
    <path d="M6 6.5 9.6 10M18 6.5 14.4 10M6 17.5 9.6 14M18 17.5 14.4 14"/>
  </symbol>
  <symbol id="ico-notas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/>
  </symbol>
  <symbol id="ico-expandir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M16 21h3a2 2 0 0 0 2-2v-3M8 21H5a2 2 0 0 1-2-2v-3"/>
  </symbol>
  <symbol id="ico-comprimir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M16 21v-3a2 2 0 0 1 2-2h3M8 21v-3a2 2 0 0 0-2-2H3"/>
  </symbol>
  <symbol id="ico-izq" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
  <symbol id="ico-der" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
  <symbol id="ico-libro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
  <symbol id="ico-imprimir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></symbol>
  <symbol id="ico-cerrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="ico-descargar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
  <symbol id="ico-limpiar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
</svg>

<header class="barra">
  <div class="marca">
    <div class="icono"><svg width="20" height="20"><use href="#ico-red"/></svg></div>
    <div>
      <h1>{{TITULO}}</h1>
      <p>{{AREA}} • {{PRESENTADOR}} <span id="sello-datos" class="tenue"></span></p>
    </div>
  </div>
  <div class="acciones">
    <button class="boton" onclick="imprimirPresentacion()" aria-label="Imprimir o exportar a PDF">
      <svg width="14" height="14"><use href="#ico-imprimir"/></svg><span>Imprimir</span>
    </button>
    <button id="btn-toggle-notes" class="boton" onclick="toggleNotesPanel()" aria-label="Alternar panel de notas">
      <svg width="14" height="14"><use href="#ico-notas"/></svg><span id="txt-toggle-notes">Mostrar Notas</span>
    </button>
    <button class="boton boton-primario" onclick="toggleFullscreen()" aria-label="Pantalla completa">
      <svg width="14" height="14" id="ico-pantalla"><use href="#ico-expandir"/></svg><span id="txt-fullscreen">Pantalla Completa</span>
    </button>
  </div>
</header>

<div class="cuerpo">
  <main class="escenario">
    <div id="slide-frame">
      <div class="brillo"></div>
      <div class="progreso"><div id="slide-progress-bar" style="width:3%"></div></div>
      <div id="slide-viewport"></div>
      <div class="pie-lamina">
        <span>{{AREA}} • {{PRESENTADOR}}</span>
        <span id="slide-number">Lámina 1</span>
      </div>
    </div>
    <div class="controles no-imprimir">
      <button class="boton-redondo" onclick="prevSlide()" aria-label="Lámina anterior"><svg width="17" height="17"><use href="#ico-izq"/></svg></button>
      <span class="pista">Flechas del teclado o Av Pág / Re Pág · <strong>F</strong> pantalla completa</span>
      <button class="boton-redondo" onclick="nextSlide()" aria-label="Lámina siguiente"><svg width="17" height="17"><use href="#ico-der"/></svg></button>
    </div>
  </main>

  <section id="notes-panel" class="oculto">
    <div class="cabecera">
      <div style="display:flex;align-items:center;gap:8px">
        <svg width="15" height="15" style="color:var(--amarillo)"><use href="#ico-libro"/></svg>
        <h3>Guía de Consulta &amp; Orador</h3>
      </div>
      <span class="insignia">Manual de Apoyo</span>
    </div>
    <div id="notes-content" class="scroll-fino"></div>
  </section>
</div>

<div id="print-root"></div>

<script>
/*{{VENDOR}}*/
</script>
<script>
/*{{DATOS}}*/
</script>
<!--{{SCRIPTS}}-->
</body>
</html>
